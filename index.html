.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }

<script>
(() => {
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const META = Object.fromEntries(D.metrics.map(m => [m.name, m]));
const TEAM_SLOT = Object.fromEntries(D.teams.map((t, i) => [t, (i % 8) + 1]));  // color follows the team, never its rank
const DATES = [...new Set(D.records.map(r => r.date))].sort();
const BY = {};  // BY[team][date] = record
for (const r of D.records) (BY[r.team] ||= {})[r.date] = r;

const store = {
  get(k, d) { try { const v = localStorage.getItem("oberon:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("oberon:" + k, JSON.stringify(v)); } catch {} },
};
// Teams start switched on only if they had a snapshot in the 90 days before the newest one;
// retired boards stay one click away in the team chips.
const RECENT = (() => {
  const cutoff = new Date(DATES.at(-1) + "T00:00:00"); cutoff.setDate(cutoff.getDate() - 90);
  const live = D.teams.filter(t => Object.keys(BY[t] || {}).some(d => new Date(d + "T00:00:00") >= cutoff));
  return live.length ? live : D.teams;
})();
const state = {
  teams: new Set(store.get("teams", RECENT).filter(t => D.teams.includes(t))),
  metrics: store.get("metrics", D.defaults).filter(m => META[m]),
  hover: null,
  tables: new Set(),
};
if (!state.teams.size) D.teams.forEach(t => state.teams.add(t));
if (!state.metrics.length) state.metrics = D.defaults.slice();

const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "text") n.textContent = v; else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  kids.flat().forEach(c => c != null && n.append(c));
  return n;
};
const svgEl = (tag, attrs = {}) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
};
const short = t => t.includes(" - ") ? t.split(" - ").pop() : t;
const color = t => `var(--series-${TEAM_SLOT[t]})`;
const fmtDate = (s, long) => new Date(s + "T00:00:00").toLocaleDateString(undefined,
  long ? { year: "numeric", month: "short", day: "numeric" } : { month: "short", day: "numeric" });
const fmt = (m, v) => {
  if (v == null) return "–";
  if (META[m]?.percent) return Math.round(v * 100) + "%";
  return Math.abs(v) >= 100 ? Math.round(v).toLocaleString() : (+v.toFixed(1)).toLocaleString();
};
const val = (team, date, m) => BY[team]?.[date]?.values[m] ?? null;
const activeTeams = () => D.teams.filter(t => state.teams.has(t));

// ---------------------------------------------------------------- header + theme
document.getElementById("title").textContent = D.title;
document.getElementById("sub").textContent =
  `${D.teams.length} teams · ${DATES.length} snapshots (${fmtDate(DATES[0], 1)} – ${fmtDate(DATES.at(-1), 1)}) · from ${D.source}, built ${fmtDate(D.generated, 1)}`;
const themeBtn = document.getElementById("themeBtn");
const applyTheme = t => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
applyTheme(store.get("theme", null));
themeBtn.onclick = () => {
  const dark = getComputedStyle(document.documentElement).colorScheme.includes("dark");
  const next = dark ? "light" : "dark"; applyTheme(next); store.set("theme", next); renderCharts();
};

// ---------------------------------------------------------------- filters
const chipsHost = document.getElementById("teamChips");
for (const t of D.teams) {
  const b = el("button", { class: "chip", type: "button", "aria-pressed": String(state.teams.has(t)), title: t },
    el("span", { class: "key", style: `color:${color(t)}` }), el("span", { text: short(t) }));
  b.onclick = () => {
    state.teams.has(t) ? state.teams.delete(t) : state.teams.add(t);
    b.setAttribute("aria-pressed", String(state.teams.has(t)));
    store.set("teams", [...state.teams]); renderAll();
  };
  chipsHost.append(b);
}

const panel = document.getElementById("pickerPanel");
const pickerBtn = document.getElementById("pickerBtn");
function buildPicker() {
  panel.replaceChildren();
  const groups = {};
  for (const m of D.metrics) (groups[m.group] ||= []).push(m);
  for (const [g, ms] of Object.entries(groups)) {
    const box = el("div", {}, el("h3", { text: g }));
    for (const m of ms) {
      const cb = el("input", { type: "checkbox" });
      cb.checked = state.metrics.includes(m.name);
      cb.onchange = () => {
        state.metrics = cb.checked ? [...state.metrics, m.name] : state.metrics.filter(x => x !== m.name);
        store.set("metrics", state.metrics); renderAll();
      };
      box.append(el("label", { title: m.note || "" }, cb, el("span", { text: m.name })));
    }
    panel.append(box);
  }
  panel.append(el("div", { class: "actions" },
    el("button", { type: "button", text: "Reset to defaults", onclick: () => { state.metrics = D.defaults.slice(); store.set("metrics", state.metrics); buildPicker(); renderAll(); } }),
    el("button", { type: "button", text: "Clear all", onclick: () => { state.metrics = []; store.set("metrics", []); buildPicker(); renderAll(); } })));
}
document.addEventListener("click", e => { const p = document.getElementById("picker"); if (p.open && !p.contains(e.target)) p.open = false; });
document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("picker").open = false; });

// ---------------------------------------------------------------- snapshot table
function renderSnapshot() {
  const host = document.getElementById("snapTable");
  const teams = activeTeams();
  document.getElementById("snapHint").textContent =
    "Each team's most recent row, with the change since its previous snapshot.";
  if (!teams.length || !state.metrics.length) { host.replaceChildren(el("div", { class: "empty", text: "Pick at least one team and one metric." })); return; }
  const head = el("tr", {}, el("th", { text: "Team" }), el("th", { text: "As of" }), state.metrics.map(m => el("th", { text: m })));
  const rows = teams.map(t => {
    const ds = Object.keys(BY[t] || {}).sort();
    const last = ds.at(-1), prev = ds.at(-2);
    return el("tr", {},
      el("td", {}, el("span", { class: "team" }, el("span", { class: "key", style: `color:${color(t)}` }), el("span", { text: short(t) }))),
      el("td", { text: last ? fmtDate(last) : "–" }),
      state.metrics.map(m => {
        const v = val(t, last, m), p = prev ? val(t, prev, m) : null;
        const td = el("td", { text: fmt(m, v) });
        if (v != null && p != null && v !== p) {
          const d = v - p, s = d > 0 ? "▲ " : "▼ ";
          td.append(el("span", { class: "delta", text: s + fmt(m, Math.abs(d)) }));
        }
        return td;
      }));
  });
  host.replaceChildren(el("table", {}, el("thead", {}, head), el("tbody", {}, rows)));
}

// ---------------------------------------------------------------- charts
function niceTicks(lo, hi, n = 4) {
  if (lo === hi) { hi = lo + 1; }
  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => raw <= s);
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step;
  const out = []; for (let v = a; v <= b + step / 2; v += step) out.push(+v.toFixed(10));
  return out;
}

const charts = [];
function renderCharts() {
  const host = document.getElementById("charts");
  host.replaceChildren(); charts.length = 0;
  if (!state.metrics.length) { host.append(el("div", { class: "card empty", text: "No metrics selected — open Metrics to pick some." })); return; }
  for (const m of state.metrics) {
    const card = el("section", { class: "card chart", "aria-label": m });
    const tableBtn = el("button", { type: "button", text: state.tables.has(m) ? "Hide table" : "Table" });
    tableBtn.onclick = () => { state.tables.has(m) ? state.tables.delete(m) : state.tables.add(m); renderCharts(); };
    const removeBtn = el("button", { type: "button", text: "✕", "aria-label": `Remove ${m}` });
    removeBtn.onclick = () => { state.metrics = state.metrics.filter(x => x !== m); store.set("metrics", state.metrics); buildPicker(); renderAll(); };
    card.append(el("div", { class: "chart-head" },
      el("div", { class: "titles" }, el("h2", { text: m }), el("div", { class: "hint", text: META[m].note || (META[m].group + (META[m].percent ? " · shown as %" : "")) })),
      tableBtn, removeBtn));
    const teams = activeTeams();
    card.append(el("div", { class: "legend" }, teams.map(t => el("span", {}, el("span", { class: "key", style: `color:${color(t)}` }), el("span", { text: short(t) })))));
    host.append(card);
    charts.push(drawChart(card, m, teams));
    if (state.tables.has(m)) card.append(dataTable(m, teams));
  }
  syncHover();
}

function dataTable(m, teams) {
  const rows = DATES.filter(d => teams.some(t => val(t, d, m) != null)).map(d =>
    el("tr", {}, el("td", { text: fmtDate(d, 1) }), teams.map(t => el("td", { text: fmt(m, val(t, d, m)) }))));
  return el("div", { class: "data-table" }, el("table", {},
    el("thead", {}, el("tr", {}, el("th", { text: "Snapshot" }), teams.map(t => el("th", { text: short(t) })))),
    el("tbody", {}, rows)));
}

function drawChart(card, m, teams) {
  const W = Math.max(280, card.clientWidth - 32), H = 226;
  const pad = { l: 44, r: 52, t: 10, b: 36 };
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": `${m} over time by team` });
  const series = teams.map(t => ({ t, pts: DATES.map(d => ({ d, v: val(t, d, m) })).filter(p => p.v != null) })).filter(s => s.pts.length);
  if (!series.length) {
    card.append(el("div", { class: "empty", text: "No data for the selected teams." }));
    return { m, set() {} };
  }
  const all = series.flatMap(s => s.pts.map(p => p.v));
  const LD = [...new Set(series.flatMap(s => s.pts.map(p => p.d)))].sort();   // this chart's own time range
  const ticks = niceTicks(Math.min(0, ...all), Math.max(...all));
  const y0 = ticks[0], y1 = ticks.at(-1);
  const t0 = +new Date(LD[0]), t1 = +new Date(LD.at(-1));
  const x = d => pad.l + (t1 === t0 ? (W - pad.l - pad.r) / 2 : ((+new Date(d) - t0) / (t1 - t0)) * (W - pad.l - pad.r));
  const y = v => pad.t + (1 - (v - y0) / (y1 - y0)) * (H - pad.t - pad.b);

  // grid + y ticks
  for (const tv of ticks) {
    svg.append(svgEl("line", { x1: pad.l, x2: W - pad.r, y1: y(tv), y2: y(tv), stroke: tv === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
    const tx = svgEl("text", { x: pad.l - 8, y: y(tv) + 4, "text-anchor": "end" }); tx.textContent = fmt(m, tv); svg.append(tx);
  }
  // x ticks: drop any label that would sit within 52px of one already placed (last date always wins)
  const placed = [];
  for (const d of [LD.at(-1), ...LD.slice(0, -1)]) {
    if (placed.some(p => Math.abs(x(p) - x(d)) < 52)) continue;
    placed.push(d);
    const tx = svgEl("text", { x: x(d), y: H - 4, "text-anchor": "middle" }); tx.textContent = fmtDate(d); svg.append(tx);
  }
  // notes markers along the baseline
  for (const d of LD) if (teams.some(t => BY[t]?.[d]?.notes)) {
    const cx = x(d), cy = H - pad.b + 4;
    const mk = svgEl("path", { d: `M${cx - 4},${cy + 7} L${cx + 4},${cy + 7} L${cx},${cy} Z`, fill: "var(--text-muted)" });
    mk.append(svgEl("title")); mk.firstChild.textContent = "This snapshot has a note (hover for details)"; svg.append(mk);
  }
  // crosshair (under lines)
  const cross = svgEl("line", { y1: pad.t, y2: H - pad.b, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" });
  svg.append(cross);
  // lines + markers
  const markers = [];
  for (const s of series) {
    const dPath = s.pts.map((p, i) => `${i ? "L" : "M"}${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
    svg.append(svgEl("path", { d: dPath, fill: "none", stroke: color(s.t), "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    for (const p of s.pts) {
      const c = svgEl("circle", { cx: x(p.d), cy: y(p.v), r: 3, fill: color(s.t), stroke: "var(--surface-1)", "stroke-width": 2 });
      c.dataset.d = p.d; svg.append(c); markers.push(c);
    }
  }
  // direct end labels, de-overlapped
  const ends = series.map(s => ({ t: s.t, y: y(s.pts.at(-1).v), x: x(s.pts.at(-1).d) })).sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 13) ends[i].y = ends[i - 1].y + 13;
  for (const e of ends) { const tx = svgEl("text", { x: e.x + 8, y: e.y + 4, class: "end-label" }); const lbl = short(e.t); tx.textContent = lbl.length > 14 ? lbl.slice(0, 13) + "…" : lbl;
    tx.append(svgEl("title")); tx.lastChild.textContent = e.t; svg.append(tx); }

  // hover layer
  const hit = svgEl("rect", { x: pad.l - 10, y: 0, width: W - pad.l - pad.r + 20, height: H, fill: "transparent", tabindex: 0 });
  svg.append(hit);
  const nearest = evt => {
    const r = svg.getBoundingClientRect(), px = (evt.clientX - r.left) * (W / r.width);
    return LD.reduce((a, d) => Math.abs(x(d) - px) < Math.abs(x(a) - px) ? d : a, LD[0]);
  };
  hit.addEventListener("pointermove", e => { state.hover = nearest(e); syncHover(m); });
  hit.addEventListener("pointerleave", () => { state.hover = null; syncHover(); });
  hit.addEventListener("focus", () => { state.hover ??= LD.at(-1); syncHover(m); });
  hit.addEventListener("blur", () => { state.hover = null; syncHover(); });
  hit.addEventListener("keydown", e => {
    const i = Math.max(0, LD.indexOf(state.hover ?? LD.at(-1)));
    if (e.key === "ArrowLeft") state.hover = LD[Math.max(0, i - 1)];
    else if (e.key === "ArrowRight") state.hover = LD[Math.min(LD.length - 1, i + 1)];
    else return;
    e.preventDefault(); syncHover(m);
  });

  const tip = el("div", { class: "tip", role: "status" });
  card.append(svg, tip);

  return {
    m,
    set(d, showTip) {
      if (!d || d < LD[0] || d > LD.at(-1)) { cross.setAttribute("visibility", "hidden"); tip.style.display = "none"; markers.forEach(c => c.setAttribute("r", 3)); return; }
      cross.setAttribute("x1", x(d)); cross.setAttribute("x2", x(d)); cross.setAttribute("visibility", "visible");
      markers.forEach(c => c.setAttribute("r", c.dataset.d === d ? 5 : 3));
      if (!showTip) { tip.style.display = "none"; return; }
      tip.replaceChildren(el("div", { class: "d", text: `Snapshot ${fmtDate(d, 1)}` }));
      const notes = new Set();
      for (const t of teams) {
        const rec = BY[t]?.[d];
        tip.append(el("div", { class: "row" },
          el("span", { class: "key", style: `color:${color(t)}` }),
          el("b", { text: fmt(m, rec?.values[m]) }),
          el("span", { text: `${short(t)}${rec?.sprint ? " · " + rec.sprint : ""}` })));
        if (rec?.notes) notes.add(rec.notes);
      }
      notes.forEach(n => tip.append(el("div", { class: "note", text: "Note: " + n })));
      tip.style.display = "block";
      const cw = card.clientWidth, tw = tip.offsetWidth;
      const cr = card.getBoundingClientRect(), sr = svg.getBoundingClientRect();
      const svgLeft = sr.left - cr.left, scale = sr.width / W;
      let left = svgLeft + x(d) * scale + 12;
      if (left + tw > cw - 8) left = svgLeft + x(d) * scale - tw - 12;
      tip.style.left = Math.max(8, left) + "px";
      tip.style.top = (sr.top - cr.top + 8) + "px";
    },
  };
}

// Crosshair is shared: hovering any chart marks the same snapshot in all of them; the tooltip shows on the active one.
function syncHover(active) { for (const c of charts) c.set(state.hover, c.m === active); }

function renderAll() { renderSnapshot(); renderCharts(); }
buildPicker(); renderAll();
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(renderCharts, 120); });
})();
</script>
</body>
</html>
